<svg width="1000" height="330" viewBox="0 0 1000 330" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="line" x1="70" y1="0" x2="930" y2="0">
    <stop stop-color="#58A6FF"/>
    <stop offset=".28" stop-color="#A371F7"/>
    <stop offset=".55" stop-color="#F0883E"/>
    <stop offset=".78" stop-color="#3FB950"/>
    <stop offset="1" stop-color="#58A6FF"/>
  </linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#161B22"/>
    <stop offset="1" stop-color="#0D1117"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
</defs>

<!-- Background -->
<rect x="1" y="1" width="998" height="328" rx="22" fill="url(#card)" stroke="#30363D"/>
<path d="M40 74H960" stroke="#21262D"/>
<text x="38" y="42" fill="#8B949E" font-family="monospace" font-size="13" letter-spacing="1.5">SAURABH@CLOUD</text>
<text x="190" y="42" fill="#484F58" font-family="monospace" font-size="13">/</text>
<text x="210" y="42" fill="#C9D1D9" font-family="monospace" font-size="13">LIVE DEVOPS PIPELINE</text>

<circle cx="912" cy="37" r="5" fill="#3FB950">
  <animate attributeName="r" values="4;7;4" dur="1.5s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="1;.35;1" dur="1.5s" repeatCount="indefinite"/>
</circle>
<text x="925" y="42" fill="#3FB950" font-family="monospace" font-size="11">RUNNING</text>

<!-- ambient glow -->
<circle cx="500" cy="168" r="95" fill="#58A6FF" opacity=".045" filter="url(#soft)">
  <animate attributeName="r" values="80;115;80" dur="4s" repeatCount="indefinite"/>
</circle>

<!-- pipeline backbone -->
<path d="M95 168H905" stroke="#30363D" stroke-width="5" stroke-linecap="round"/>
<path d="M95 168H905" stroke="url(#line)" stroke-width="2" stroke-linecap="round"
      stroke-dasharray="10 18">
  <animate attributeName="stroke-dashoffset" from="0" to="-112" dur="1.2s" repeatCount="indefinite"/>
</path>

<!-- stage cards -->
<g font-family="Arial, sans-serif" text-anchor="middle">
  <!-- SOURCE -->
  <g>
    <rect x="48" y="112" width="130" height="112" rx="16" fill="#0D1117" stroke="#58A6FF"/>
    <circle cx="113" cy="157" r="24" fill="#161B22" stroke="#58A6FF" stroke-width="2"/>
    <text x="113" y="162" fill="#58A6FF" font-size="11" font-weight="700">GIT</text>
    <text x="113" y="190" fill="#F0F6FC" font-size="13" font-weight="700">SOURCE</text>
    <text x="113" y="208" fill="#8B949E" font-family="monospace" font-size="9">commit</text>
  </g>

  <!-- DELIVERY -->
  <g>
    <rect x="235" y="112" width="130" height="112" rx="16" fill="#0D1117" stroke="#A371F7"/>
    <circle cx="300" cy="157" r="24" fill="#161B22" stroke="#A371F7" stroke-width="2"/>
    <text x="300" y="162" fill="#A371F7" font-size="10" font-weight="700">CI/CD</text>
    <text x="300" y="190" fill="#F0F6FC" font-size="13" font-weight="700">DELIVERY</text>
    <text x="300" y="208" fill="#8B949E" font-family="monospace" font-size="9">build • test</text>
  </g>

  <!-- PLATFORM -->
  <g>
    <rect x="422" y="112" width="130" height="112" rx="16" fill="#0D1117" stroke="#58A6FF"/>
    <circle cx="487" cy="157" r="24" fill="#161B22" stroke="#58A6FF" stroke-width="2"/>
    <text x="487" y="162" fill="#58A6FF" font-size="10" font-weight="700">EKS</text>
    <text x="487" y="190" fill="#F0F6FC" font-size="13" font-weight="700">PLATFORM</text>
    <text x="487" y="208" fill="#8B949E" font-family="monospace" font-size="9">deploy • scale</text>
  </g>

  <!-- INFRA -->
  <g>
    <rect x="609" y="112" width="130" height="112" rx="16" fill="#0D1117" stroke="#F0883E"/>
    <circle cx="674" cy="157" r="24" fill="#161B22" stroke="#F0883E" stroke-width="2"/>
    <text x="674" y="162" fill="#F0883E" font-size="10" font-weight="700">IaC</text>
    <text x="674" y="190" fill="#F0F6FC" font-size="13" font-weight="700">TERRAFORM</text>
    <text x="674" y="208" fill="#8B949E" font-family="monospace" font-size="9">plan • apply</text>
  </g>

  <!-- SIGNALS -->
  <g>
    <rect x="796" y="112" width="130" height="112" rx="16" fill="#0D1117" stroke="#3FB950"/>
    <circle cx="861" cy="157" r="24" fill="#161B22" stroke="#3FB950" stroke-width="2"/>
    <text x="861" y="162" fill="#3FB950" font-size="10" font-weight="700">OBS</text>
    <text x="861" y="190" fill="#F0F6FC" font-size="13" font-weight="700">SIGNALS</text>
    <text x="861" y="208" fill="#8B949E" font-family="monospace" font-size="9">metrics • logs</text>
  </g>
</g>

<!-- moving packet -->
<circle r="6" fill="#FFFFFF" filter="url(#glow)">
  <animateMotion dur="4.6s" repeatCount="indefinite"
    path="M95 168 L235 168 L365 168 L422 168 L552 168 L609 168 L739 168 L796 168 L905 168"/>
</circle>

<!-- tiny telemetry pulses -->
<circle cx="487" cy="168" r="3" fill="#58A6FF">
  <animate attributeName="r" values="3;13;3" dur="2s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/>
</circle>
<circle cx="861" cy="168" r="3" fill="#3FB950">
  <animate attributeName="r" values="3;13;3" dur="2s" begin=".7s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="1;0;1" dur="2s" begin=".7s" repeatCount="indefinite"/>
</circle>

<!-- footer -->
<text x="500" y="275" fill="#C9D1D9" font-family="monospace" font-size="12" text-anchor="middle">
  BUILD  →  SHIP  →  RUN  →  SCALE  →  OBSERVE
</text>
<text x="500" y="296" fill="#484F58" font-family="monospace" font-size="10" text-anchor="middle">
  infrastructure as code • cloud-native delivery • production observability
</text>
</svg>